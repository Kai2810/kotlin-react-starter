# Local Postgres for development. Spring Boot's Docker Compose support starts it on bootRun.
name: kotlin-react-starter
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 2s
      timeout: 3s
      retries: 15
